aid: open-service-mesh
name: Open Service Mesh
description: >-
  Open Service Mesh (OSM) is a lightweight, extensible, cloud native service mesh
  built on Envoy and the Service Mesh Interface (SMI) specification. OSM provides
  traffic shifting, mutual TLS, access control, observability, and automatic
  sidecar injection for Kubernetes-based microservices. The project is now
  archived by the CNCF.
